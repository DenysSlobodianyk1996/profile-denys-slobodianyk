# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: [ "main" ]

# Add permissions
permissions:
  contents: read
  pages: write
  id-token: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      # The build prerenders every route in headless Chromium (scripts/prerender.mjs).
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # The IndexNow job runs on a fresh runner, so hand it the files it submits from.
      # deploy needs this job, so a failed upload must not fail it: IndexNow is optional.
      - name: Upload IndexNow inputs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-inputs
          path: |
            dist/sitemap.xml
            dist/*.txt
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4

  # Tells IndexNow (Bing, Copilot and other engines) that the sitemap URLs changed.
  # scripts/indexnow.mjs turns any failure into a warning, and continue-on-error keeps a
  # broken step from marking the run failed: the site is already live at this point.
  indexnow:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Only resubmit when the push touched what ends up on the site. The checkout is
      # shallow, so fetch the pre-push commit on its own; git diff needs just the two trees.
      # A first push (all-zero `before`) or a force push whose old tip is gone submits anyway.
      - name: Check for site changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "No previous commit to compare against, submitting."
            echo "site=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(public/|src/|build/|index\.html$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under public/, src/, build/ or index.html, skipping IndexNow."
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download IndexNow inputs
        if: steps.changes.outputs.site == 'true'
        uses: actions/download-artifact@v4
        with:
          name: indexnow-inputs
          path: dist

      - name: Submit URLs to IndexNow
        if: steps.changes.outputs.site == 'true'
        run: node scripts/indexnow.mjs dist
